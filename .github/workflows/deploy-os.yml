# Deploy the new Debo app (os/) to Cloudflare Workers + Containers at my.debo.life and api.debo.life.
# Runs on a push to main that touches it, or by hand. Separate from deploy.yml: it never touches the debo-web Worker, which still serves debo.life.
# Deploys three Workers: debo-os-browser (private), debo-os-api, debo-os-app.
# Secrets used (names only; set in GitHub repo settings > Secrets). See
# os/infra/cloudflare/README.md for how to create each one.
#   Already exist:
#     CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID   - needs Workers + Containers edit
#     DATABASE_URL_UNPOOLED                         - Debo's Neon database (os keeps its rows in schema "os")
#     MEM0_API_KEY, LIVEKIT_URL, LIVEKIT_API_KEY, LIVEKIT_API_SECRET, VOICE_AGENT_SECRET
#   Must be created (required):
#     NEON_AUTH_BASE_URL, NEON_AUTH_JWKS_URL        - same values the web app uses
#     ANTHROPIC_API_KEY                             - answers and the agent (MODEL is anthropic/claude-haiku-5-5)
#     DEBO_OS_TOKEN_ENCRYPTION_KEY                  - 32 random bytes, base64
#     DEBO_OS_SESSION_SIGNING_KEY                   - 32 random bytes, base64
#     DEBO_OS_WORKER_TOKEN                          - 32+ characters, shared API <-> browser
#   Optional:
#     NEON_AI_GATEWAY_BASE_URL, NEON_AI_GATEWAY_TOKEN - search by meaning (keyword search works without)
name: Deploy OS

on:
  push:
    branches: [main]
    paths: ["os/**", "packages/**", ".github/workflows/deploy-os.yml", ".dockerignore"]
  workflow_dispatch:

concurrency:
  group: deploy-os
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v5

      - name: Check required secrets are set
        env:
          DATABASE_URL_UNPOOLED: ${{ secrets.DATABASE_URL_UNPOOLED }}
          NEON_AUTH_BASE_URL: ${{ secrets.NEON_AUTH_BASE_URL }}
          NEON_AUTH_JWKS_URL: ${{ secrets.NEON_AUTH_JWKS_URL }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          DEBO_OS_TOKEN_ENCRYPTION_KEY: ${{ secrets.DEBO_OS_TOKEN_ENCRYPTION_KEY }}
          DEBO_OS_SESSION_SIGNING_KEY: ${{ secrets.DEBO_OS_SESSION_SIGNING_KEY }}
          DEBO_OS_WORKER_TOKEN: ${{ secrets.DEBO_OS_WORKER_TOKEN }}
        run: |
          missing=""
          for name in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID DATABASE_URL_UNPOOLED \
            NEON_AUTH_BASE_URL NEON_AUTH_JWKS_URL ANTHROPIC_API_KEY \
            DEBO_OS_TOKEN_ENCRYPTION_KEY DEBO_OS_SESSION_SIGNING_KEY DEBO_OS_WORKER_TOKEN; do
            [ -n "${!name}" ] || missing="$missing $name"
          done
          if [ -n "$missing" ]; then echo "::error::Missing GitHub secrets:$missing"; exit 1; fi

      - uses: pnpm/action-setup@v4
        with:
          package_json_file: os/package.json

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      # wrangler builds the container images with Docker (BuildKit).
      - uses: docker/setup-buildx-action@v3

      # The new app lives on its own addresses. debo.life itself stays on the debo-web Worker.
      - name: Set the addresses
        id: urls
        run: |
          echo "api=https://api.debo.life" >> "$GITHUB_OUTPUT"
          echo "app=https://my.debo.life" >> "$GITHUB_OUTPUT"

      - name: Install
        run: |
          pnpm --dir os install --frozen-lockfile
          npm --prefix os/infra/cloudflare ci

      - name: Build the web app (API URL is baked in)
        working-directory: os
        env:
          EXPO_PUBLIC_API_URL: ${{ steps.urls.outputs.api }}
        run: |
          pnpm build:web
          # Guard: the API address must be inside the exported JavaScript (a stale cache would hide it).
          grep -rlF "$EXPO_PUBLIC_API_URL" apps/mobile/dist/web/_expo >/dev/null

      - name: Deploy the browser (private)
        working-directory: os/infra/cloudflare
        env:
          WORKER_TOKEN: ${{ secrets.DEBO_OS_WORKER_TOKEN }}
        run: |
          jq -n '{WORKER_TOKEN: env.WORKER_TOKEN}' > "$RUNNER_TEMP/browser-secrets.json"
          npx wrangler deploy -c browser/wrangler.jsonc --secrets-file "$RUNNER_TEMP/browser-secrets.json"

      - name: Deploy the API
        working-directory: os/infra/cloudflare
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL_UNPOOLED }}
          NEON_AUTH_BASE_URL: ${{ secrets.NEON_AUTH_BASE_URL }}
          NEON_AUTH_JWKS_URL: ${{ secrets.NEON_AUTH_JWKS_URL }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          NEON_AI_GATEWAY_BASE_URL: ${{ secrets.NEON_AI_GATEWAY_BASE_URL }}
          NEON_AI_GATEWAY_TOKEN: ${{ secrets.NEON_AI_GATEWAY_TOKEN }}
          MEM0_API_KEY: ${{ secrets.MEM0_API_KEY }}
          COMPOSIO_API_KEY: ${{ secrets.COMPOSIO_API_KEY }}
          LIVEKIT_URL: ${{ secrets.LIVEKIT_URL }}
          LIVEKIT_API_KEY: ${{ secrets.LIVEKIT_API_KEY }}
          LIVEKIT_API_SECRET: ${{ secrets.LIVEKIT_API_SECRET }}
          VOICE_AGENT_SECRET: ${{ secrets.VOICE_AGENT_SECRET }}
          TOKEN_ENCRYPTION_KEY: ${{ secrets.DEBO_OS_TOKEN_ENCRYPTION_KEY }}
          SESSION_SIGNING_KEY: ${{ secrets.DEBO_OS_SESSION_SIGNING_KEY }}
          WORKER_TOKEN: ${{ secrets.DEBO_OS_WORKER_TOKEN }}
        run: |
          # Empty values are dropped, so an optional secret that is not set just turns its feature off.
          jq -n 'env | {DATABASE_URL, NEON_AUTH_BASE_URL, NEON_AUTH_JWKS_URL, ANTHROPIC_API_KEY,
                  NEON_AI_GATEWAY_BASE_URL, NEON_AI_GATEWAY_TOKEN, MEM0_API_KEY, COMPOSIO_API_KEY,
                  LIVEKIT_URL, LIVEKIT_API_KEY, LIVEKIT_API_SECRET, VOICE_AGENT_SECRET,
                  TOKEN_ENCRYPTION_KEY, SESSION_SIGNING_KEY, WORKER_TOKEN}
                 | with_entries(select(.value != null and .value != ""))' \
            > "$RUNNER_TEMP/api-secrets.json"
          npx wrangler deploy -c api/wrangler.jsonc \
            --secrets-file "$RUNNER_TEMP/api-secrets.json" \
            --var "PUBLIC_API_URL:${{ steps.urls.outputs.api }}" \
            --var "ALLOWED_ORIGINS:${{ steps.urls.outputs.app }}"

      - name: Deploy the app
        working-directory: os/infra/cloudflare
        run: npx wrangler deploy -c app/wrangler.jsonc

      - name: Smoke test
        run: |
          api="${{ steps.urls.outputs.api }}"
          app="${{ steps.urls.outputs.app }}"
          # A new container can take several minutes to provision after the first deploy.
          ok=""
          for i in $(seq 1 40); do
            body=$(curl -s --max-time 30 "$api/api/health" || true)
            if echo "$body" | jq -e '.ok == true' >/dev/null 2>&1; then ok=1; break; fi
            echo "attempt $i: not ready yet"; sleep 15
          done
          [ -n "$ok" ] || { echo "::error::$api/api/health never returned ok"; exit 1; }
          echo "API health: $body"
          echo "$body" | jq -e '.browserConfigured == true' >/dev/null || { echo "::error::browser not configured"; exit 1; }
          echo "$body" | jq -e '.auth.mode == "neon"' >/dev/null || { echo "::error::API is not in Neon Auth mode"; exit 1; }
          # The journal route must answer 401 (it needs sign-in), not 404 or a crash.
          test "$(curl -s -o /dev/null -w '%{http_code}' "$api/api/debo/status")" = "401"
          test "$(curl -s -o /dev/null -w '%{http_code}' "$app/")" = "200"
          # Single-page-app fallback: a deep link must serve the app shell.
          test "$(curl -s -o /dev/null -w '%{http_code}' "$app/some/deep/link")" = "200"
          echo "Preview is up: app $app, api $api"
