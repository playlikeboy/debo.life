# Deploy the landing page (apps/site) to Cloudflare Workers as "debo-site".
# It is served at about.debo.life. debo.life is still served by debo-web.
# Runs on a push to main that touches the landing page, or by hand.
# Secrets used (names only): CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID.
name: Deploy site

on:
  push:
    branches: [main]
    paths: ["apps/site/**", ".github/workflows/deploy-site.yml"]
  workflow_dispatch:

concurrency:
  group: deploy-site
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4 # version comes from "packageManager" in package.json

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm --filter @debo/site typecheck

      - name: Build and deploy
        working-directory: apps/site
        run: pnpm run deploy

      - name: Live check
        run: |
          for i in $(seq 1 20); do
            code=$(curl -s -m 20 -o /dev/null -w '%{http_code}' https://about.debo.life/ || true)
            echo "attempt $i: $code"
            [ "$code" = "200" ] && exit 0
            sleep 10
          done
          echo "::error::about.debo.life did not answer 200"; exit 1
