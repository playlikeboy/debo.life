packages:
  - apps/mobile
  - apps/worker
  # Debo's personal brain, shared with the web app in ../apps/web.
  - ../packages/brain
  - ../packages/db
  - ../packages/llm
  - ../packages/memory
allowBuilds:
  esbuild: true
  '@biomejs/biome': true
  '@scarf/scarf': false
  '@google/genai': false
  better-sqlite3: false
  protobufjs: false
  '@astryxdesign/core': false
minimumReleaseAgeExclude:
  - '@tanstack/ai-anthropic@0.18.13'
  - '@tanstack/ai-gemini@0.32.1'
  - '@tanstack/ai-openai@0.23.2'
  - '@tanstack/ai@0.59.0'
  - '@tanstack/openai-base@0.10.16'
  - '@astryxdesign/core@0.7.16'
  - '@astryxdesign/theme-butter@0.7.16'

overrides:
  'image-size': '2.0.4'

patchedDependencies:
  metro@0.83.3: patches/metro@0.83.3.patch
